name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Require prerendered species pages
        run: python3 -c "from pathlib import Path; p=Path('src/app/turler/[slug]/page.tsx'); t=p.read_text(); t=t.replace('export const dynamicParams = true;','export const dynamicParams = false;'); p.write_text(t); assert 'dynamicParams = false' in p.read_text()"
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://ardakaradag36.github.io/bioatlastr
          NODE_OPTIONS: --max-old-space-size=4096
      - run: touch out/.nojekyll
      - name: Drop RSC text files so Pages can finish the upload
        run: |
          find out -name '__next*.txt' -delete
          find out -name 'index.txt' -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
